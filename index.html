<!DOCTYPE html>
<html>
    <head>
        <!-- THE GREAT LINKING -->
        <link rel="stylesheet" href="style.css">
        <script type="text/javascript" src="https://cdn.canvasjs.com/canvasjs.min.js"></script>
       
       <!-- All Javascript logic -->
       
        
    </head>
    <body>
        <div id='enterusername' style='opacity: 0; display:none; grid-template-columns:5fr 3fr; height: 65px; column-gap: 15px;'>
            <input id='usernameinput' style='font-size:25px; border-radius: calc(100px * var(--brm)); corner-shape: squircle;' placeholder=' Type in your username here...'>
            <button onclick='changeusername()' style='font-size:25px; font-family: "Teachers", sans-serif;'>Set username</button>
        </div>

        <div id='main'>
            <div id='infocard' class="containerdiv" style="display: grid; grid-template-columns: 1fr 1fr 2fr; align-items: center; column-gap: 50px;"></div>
            
            <br><br>

            <section id='section1' style='display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; column-gap: 20px;'>
                <a class='containerdiv' href='repositories.html' style='border-style: none !important; text-decoration: none;  padding: 10px !important;'><p style='text-align: center; font-family: "Elms Sans", sans-serif; font-size: 17px;'>Repositories &#8594</p></a>
            </section>

            <br><br>

            <footer>
                <button onclick='resetpage()' style='font-size:10px; padding: 5px; border: 0px white none;'>  Click this to reset your username  </button>
            </footer>
        </div>

        

        <!-- Javascript Logic -->

        <script>
        const username = localStorage.getItem("username") || 'none';

        if (username === 'none') {
            document.getElementById('main').style.opacity = 0;
            document.getElementById('enterusername').style.opacity = 1;
            document.getElementById('enterusername').style.display = 'grid';
        } else {
            getGitHubUser(username);     
        }

        function changeusername() {
            const usernameinput = document.getElementById('usernameinput').value;

            if (document.getElementById('usernameinput').value != '') {
                localStorage.setItem("username", usernameinput)
            }

            document.getElementById('main').style.opacity = 1;
            document.getElementById('enterusername').style.opacity = 0;

            getGitHubUser(localStorage.getItem('username'));
        }
        
        function resetpage() {
            localStorage.clear()
            location.reload()
        }
    
        async function getGitHubUser(user_name) {
            const infocard = document.getElementById('infocard');

            const response = await fetch(
                `https://api.github.com/users/${user_name}`
            );

            const user = await response.json();


            infocard.innerHTML = `
                <div style='display: flex; justify-content: center; align-items: center;'>
                    <br>
                    <img src='${user.avatar_url}' style='width:150px; border-radius:9999px;'>    
                </div>
                <div>
                    <a href='${user.html_url}' target='_blank' style='color:white; text-decoration:none;'><h1>${user.name} / @${user.login}</h1></a>
                    <p>${user.bio}</p>
                    <hr>
                    <div style='display:grid; grid-template-columns: 200px 100px 150px 200px;'>
                        <p>Public Repositories: ${user.public_repos}</p>
                        <p>Gists: ${user.public_gists}</p>
                        <p>Followers: ${user.followers}</p>
                        <p>Following: ${user.following}</p>
                    </div>
                    
                </div>
                <div style='border-radius: calc(16px * var(--brm)); corner-shape: squircle; border: 5px solid #ffffff59; padding:25px;'>
                    <p><strong>Contact:</strong> ${user.email ? user.email !== 'null' : 'N/A'}</p>
                    <p><strong>Company:</strong> ${user.company ? user.company !== 'null': 'N/A'}</p>
                    <p><strong>Hireable:</strong> ${user.hireable ? user.hireable !== 'null' : 'N/A'}</p>
                </div>
                <div></div>
                <div style='display:grid; column-gap:10px; grid-template-columns: 1fr 1fr;'>
                    <p><em>Created At: ${user.created_at}</em></p>
                    <p><em>Last Updated: ${user.updated_at}</em></p>
                </div>
            `;
        }   
        </script>
    </body>
</html>
