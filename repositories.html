<!DOCTYPE html>
<html>
    <head>
        <link rel='stylesheet' href='style.css'>
        <script type="text/javascript" src="https://cdn.canvasjs.com/canvasjs.min.js"></script>
    </head>
    <body onload='getGitCards()'>
        <section id='section1' style='display: grid; grid-template-columns: 75px 150px; column-gap: 20px;'>
            <a class='containerdiv' href='index.html' style='padding: 10px !important; border-style: none !important; text-decoration: none; '><p style='text-align: center; font-family: "Elms Sans", sans-serif; font-size: 11px;'>&#8592 Back</p></a>
            <button class='containerdiv' onclick='showall()' style='padding: 10px !important; border-style: none !important; text-decoration: none; '><p style='text-align: center; font-family: "Elms Sans", sans-serif; font-size: 11px;'>View All Repositories</p></button>
        </section>
        <br>
        <div class='containerdiv' style='display: grid; grid-template-columns: 25px 4fr 1fr; '>
            <div></div>
            <div style='align-items: center;'><br>
            <h1>My Repositories </h1>
            <p>Have a look at your repositories and look deeper</p>
            </div>
            <div>
                <img id='avatarimg' style='width: 200px; height: 200px; border-radius: 9999px;'>
            </div>
        </div>
        <br><br>

        <div class='containerdiv' id='repos' style='display: grid; grid-template-columns: 1fr 1fr 1fr; column-gap: 25px; row-gap: 25px;'></div>
        <div class='containerdiv' id='reposanalytics' style='opacity: 0;'></div>
        <script>

            const username = localStorage.getItem("username");

            // Used to get the Github Repository information and turn them into individual cards

            async function getGitCards() {

            const response = await fetch(
                `https://api.github.com/users/${username}/repos`
            );

            const repos = await response.json();

            repos.forEach(repo => {

                const card = document.createElement('div');

                card.innerHTML = `
                <div class='containerdiv'>
                    <div style='display:grid; grid-template-columns:2fr 1fr; column-gap:13px;'>
                        <h2>${repo.name}</h2>
                        <button style='font-size: 15px; border:0px white none; padding:2px !important;' onclick='getRepoInfo("${repo.name}")'>Check Out &#8594</button>
                    </div>
                    <p>${repo.description || "No description"}</p>

                    <p>Language (Majority): ${repo.language || "Unknown"}</p>
                    <div style='display:grid; grid-template-columns:30px 30px; align-items:center; column-gap:10px;'><img src='Icons/stars.png' style='width:30px; border-radius:16px; corner-shape:squircle;'>  <p>${repo.stargazers_count}</p></div>
                    <div style='display:grid; grid-template-columns:30px 30px; align-items:center; column-gap:10px;'><img src='Icons/watchers.png' style='width:30px; border-radius:16px; corner-shape:squircle;'>  <p>${repo.watchers}</p></div>
                    <div style='display:grid; grid-template-columns:30px 30px; align-items:center; column-gap:10px;'><img src='Icons/forks.png' style='width:30px; border-radius:16px; corner-shape:squircle;'>  <p>${repo.forks_count}</p></div>
                </div>
                `;

                document.getElementById("repos").appendChild(card);
            });

            document.getElementById('avatarimg').src = repos[0].owner.avatar_url;
            }

            // Used to get the difference in time between a date entered and the current time. WARNING TO MUCH MATH

            function timeDiff(time) {
                const now = new Date();
                const timethen = new Date(time);
                const diffindays = (now - timethen) / 1000 / 60 / 60 / 24;

                if (diffindays < 1) {
                    return `${Math.floor((now - timethen) / 1000 / 60 / 60)} hours ago`;
                } else if (diffindays < 365) {
                    return `${Math.floor((now - timethen) / 1000 / 60 / 60 / 24)} days ago`;
                } else {
                    return `${Math.floor((now - timethen) / 1000 / 60 / 60 / 24 / 365)} years ago`;
                }
            }

            // Gets information about specific repositories when the user clicks on one

            async function getRepoInfo(repo_clicked){
                const username = localStorage.getItem("username");

                document.getElementById('repos').style.opacity = 0;
                document.getElementById('repos').style.display = 'none';

                const reposanalyser = document.getElementById('reposanalytics');
                reposanalyser.style.opacity = 1;
                reposanalyser.style.display = 'grid';


                // Get Main Repo Info

                const response = await fetch(
                    `https://api.github.com/users/${username}/repos`
                );

                const repos = await response.json();

                const index = Object.values(repos).map(repo => repo.name).indexOf(repo_clicked);

                const repoclicked = repo_clicked;

                // Get Commit Info

                const commitresponse = await fetch(
                    `https://api.github.com/repos/${username}/${repo_clicked}/commits`
                );

                let commits = await commitresponse.json();

                // Get Languages Info

                const languages = await fetch(
                    `${repos[index].languages_url}`
                );

                const languagesdata = await languages.json();

                // Get Events Info

                const eventsresponse = await fetch(
                    `https://api.github.com/repos/${username}/${repo_clicked}/events`
                );

                const events = await eventsresponse.json();

                // Commits Sorting

                const allcommits = [];

                for (let i = 0; i < commits.length; i++) {
                    allcommits.push(`<li><strong>${commits[i].commit.author.name}</strong> - ${commits[i].commit.message}</li>`);
                }

                // Events Sorting

                let allevents = ``;

                for (let i = 0; i < events.length; i++) {
                    allevents += ` - A <strong>${events[i].type}</strong> was issued by <i>${events[i].actor.login}</i> around ${timeDiff(events[i].created_at)}\n`;
                }


                // Languages sorting

                const langlistnum = Object.values(languagesdata);

                const total = Object.values(languagesdata).reduce((sum, value) => sum + value, 0);

                const result = Object.entries(languagesdata).map(([label, value]) => ({
                    y: Number(((value / total) * 100).toFixed(2)),
                    label: label
                }));

                // Stuffs all that information into one MEGA div

                reposanalyser.innerHTML = `
                <h1>${repoclicked} <span style='font-size:14px; align-items:center; background-color:green; border: 1px green solid; padding:2px;'>${repos[index].private ? 'Private' : 'Public'}</span></h1>
                <p>${repos[index].description || 'No description'}</p>
                <div class='containerdiv' style='display:grid; grid-template-columns:100px 100px 100px 220px 250px 200px; font-size:15px; align-items:center;'>
                    <div style='display:grid; grid-template-columns:30px 30px; align-items:center; column-gap:10px;'><img src='Icons/stars.png' style='width:30px; border-radius:16px; corner-shape:squircle;'>  <p>${repos[index].stargazers_count}</p></div>
                    <div style='display:grid; grid-template-columns:30px 30px; align-items:center; column-gap:10px;'><img src='Icons/watchers.png' style='width:30px; border-radius:16px; corner-shape:squircle;'>  <p>${repos[index].watchers}</p></div>
                    <div style='display:grid; grid-template-columns:30px 30px; align-items:center; column-gap:10px;'><img src='Icons/forks.png' style='width:30px; border-radius:16px; corner-shape:squircle;'>  <p>${repos[index].forks_count}</p></div>
                    <div><p><strong>Created:</strong> ${timeDiff(repos[index].created_at)}</p></div>
                    <div><p><strong>Last Pushed At:</strong> ${timeDiff(repos[index].pushed_at)}</p></div>
                    <div><p><strong>License:</strong> ${repos[index].license?.name || 'No License'}</p></div>
                </div>
                <br><br>
                <div style='display:grid; grid-template-columns: 2fr 1fr; column-gap:35px;'>
                    <div style='display:grid; grid-template-columns:1fr 1fr; column-gap:35px;' class='containerdiv'>
                        <div>
                            <h2>Repository Details</h2>    
                            <div style='display:grid; grid-template-columns:300px 3px 300px; column-gap:15px;'>
                                <div>
                                    <p><strong>License:</strong> ${repos[index].license?.spdx_id || 'No License Identifier'}</p>
                                    <p><strong>Size:</strong> ${repos[index].size > 1000 ? `${repos[index.size / 1000]} MB` : `${repos[index].size} KB` } </p>
                                    <p><strong>Default Branch:</strong> ${repos[index].default_branch}</p>
                                    <p><strong>Repository Archived:</strong> ${repos[index].archived ? 'Archived' : 'Not Archived'}</p>
                                    <p><strong>Open Issues Count:</strong> ${repos[index].open_issues_count}</p>
                                    <p><strong>Disabled:</strong> ${repos[index].disabled ? 'Yes' : 'No'}</p>
                                    <p><strong>Disabled:</strong> ${repos[index].disabled ? 'Yes' : 'No'}</p>
                                </div>
                                <div style='background-color:white; border-radius:1.5px; corner-shape:squircle;'></div>
                                <div>
                                    <p><strong>Has Github Pages: </strong> ${repos[index].has_pages ? 'Has Github Pages' : 'No Pages'}</p>
                                    <p><strong>Has Downloads: </strong> ${repos[index].has_downloads ? 'Has Downloads' : 'Downloads Not Available'}</p>
                                    <p><strong>Has Downloads: </strong> ${repos[index].has_wiki ? 'Has Wiki' : 'No Wiki'}</p>
                                    <p><strong>Forking Allowed: </strong> ${repos[index].allow_forking ? 'Yes' : 'No'}</p>
                                    <p><strong>Has Pull Requests: </strong> ${repos[index].has_pull_requests ? 'Yes' : 'No'}</p>
                                    <p><strong>Has Discussions: </strong> ${repos[index].has_discussions ? 'Yes' : 'No'}</p>
                                    <p style='color:whitesmoke;'><strong>Link to Repository: </strong><a href='${repos[index].html_url}'>${repos[index].html_url}</a></p>
                                </div>
                            </div>
                        </div>
                        <div></div>
                    </div>
                    <div class='containerdiv' style='display:grid;>
                        <div class='containerdiv' style='overflow:scroll;'>
                            <h3>Recent Activity:</h3>
                            <p>${allevents || 'There is no activity for this repository'}</p>
                        </div>
                    </div>
                </div><br><br>
                <div style='display:grid; grid-template-columns:1fr 1fr; column-gap:35px;'>
                    <div class='containerdiv' style='display:flex; overflow: scroll; height:300px; padding:15px;'>
                        <h3>Recent Commits:</h3>
                        <div id='commitsdiv'>
                        <p id='commitlist'><ul>${allcommits.join(' ') || 'No Commits have been done to this repository yet'}</ul></p>
                        <br>
                        </div>
                    </div>
                    <div style='display:grid; grid-template-columns:1fr;'>
                        <div id='chartContainer'></div>
                    </div>
                </div>
                `;

                // Turns the languages into a pie chart

                createlanguagepi(result)
            }

            // So the user can go back and look at more repositories

            function showall() {
                document.getElementById('repos').style.opacity = 1;
                document.getElementById('repos').style.display = 'grid';

                const reposanalyser = document.getElementById('reposanalytics');
                reposanalyser.style.opacity = 0;
                document.getElementById('reposanalytics').style.display = 'none';
            }
        </script>
        <script>

            // Creates the pie chart on the languages used in the repository

            async function createlanguagepi(languages) {

            var chart = new CanvasJS.Chart("chartContainer", {
            animationEnabled: true,
            title:{
            text:"Coding Languages Usage",
            fontFamily: "'Elms Sans', sans-serif",
            },
            data: [{
                type: "pie",
                indexLabelFontSize: 11,
                indexLabelFontFamily: "'Elms Sans', sans-serif",
                radius: 80,
                indexLabel: "{label} - {y}",
                yValueFormatString: "###0.0\"%\"",
                click: explodePie,
                dataPoints: languages
            }]
        });
        chart.render();

        function explodePie(e) {
            for(var i = 0; i < e.dataSeries.dataPoints.length; i++) {
                if(i !== e.dataPointIndex)
                    e.dataSeries.dataPoints[i].exploded = false;
            }
        }
            chart.render();

            }
        </script>
    </body>
</html>
